<script>
const data = [['01','Marca','Naming, branding, identidade<br>visual e posicionamento.'],['02','Conteúdo','Estratégia, produção de conteúdo,<br>fotografia e vídeo.'],['03','Digital','Sites, landing pages, e-commerces<br>e soluções digitais.'],['04','Performance','Tráfego pago, campanhas, análise<br>de dados e otimização.']];
const wrap = document.querySelector('.calls');
const els = data.map(([n,t,s]) => { const d = document.createElement('div'); d.className='call'; d.innerHTML = '<i></i>'; wrap.appendChild(d); return d; });
const labs = data.map(([n,t,s]) => { const d = document.createElement('div'); d.className='lab'; d.innerHTML = '<b>'+n+'</b><strong>'+t+'</strong><em>'+s+'</em>'; wrap.appendChild(d); return d; });
const svg = document.querySelector('svg.links');
// pontos na silhueta direita de cada fatia (medidos na imagem, 2017 x 1428)
const SIL = [[1181, 200], [1424, 476], [1673, 755], [1924, 1020]];
function place() {
  const img = document.querySelector('.pyr img'), r = img.getBoundingClientRect(), k = r.width / 2017;
  const pts = SIL.map(([x, y]) => [r.left + x * k + 26, r.top + y * k]);
  const ys = pts.map(p => p[1]), mid = (ys[0] + ys[3]) / 2, gap = 128;
  const maxX = Math.max(...pts.map(p => p[0])), kx = maxX + 30, tx = Math.max(742, kx + 46);
  let lines = '';
  pts.forEach(([x, y], i) => {
    const ly = mid + (i - 1.5) * gap;
    els[i].style.transform = 'translate(' + x + 'px,' + y + 'px)';
    labs[i].style.left = tx + 'px'; labs[i].style.top = ly + 'px';
    lines += '<polyline points="' + (x + 8) + ',' + y + ' ' + kx + ',' + y + ' ' + (kx + 24) + ',' + ly + ' ' + (tx - 14) + ',' + ly + '"/>';
  });
  svg.innerHTML = lines;
}
document.querySelector('.pyr img').complete ? place() : document.querySelector('.pyr img').addEventListener('load', place);
</script>
