<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.halo { position:absolute; inset:0; overflow:hidden; }
.halo i { position:absolute; left:50%; top:-24%; width:1900px; aspect-ratio:1; transform:translateX(-50%); border-radius:50%;
  background: radial-gradient(closest-side, transparent 58%, rgba(90,120,255,.6) 66%, rgba(31,79,216,.6) 72%, rgba(31,79,216,.2) 82%, transparent 92%); filter: blur(30px);

.halo b { position:absolute; left:0; right:0; bottom:0; height:58%; background: radial-gradient(70% 90% at 50% 100%, rgba(31,79,216,.95), rgba(31,79,216,.45) 45%, transparent 75%); }
.pill-nav { position:absolute; z-index:4; top:64px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:34px;

  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 55%, rgba(255,255,255,.07)), rgba(20,26,38,.35);

.pill-nav .logo { width:120px; }
.pill-nav span { font-size:21px; color: var(--apoio); }
.pill-nav em { white-space:nowrap; font-style:normal; font-size:20px; font-weight:500; color: var(--preto); background: var(--gelo); padding: 13px 24px; border-radius:999px; }
.content { position:absolute; z-index:3; left:80px; right:80px; top:330px; height:580px; display:grid; align-content:center; justify-items:center; gap:32px; text-align:center; }
h1 { font-size: 86px; font-weight: 600; line-height: .98; letter-spacing: -.048em; text-wrap: balance; }
p { font-size: 29px; line-height: 1.45; color: var(--apoio); }
.ctas { display:flex; gap:12px; margin-top:6px; }
.ctas b { font-weight:500; font-size:23px; background: var(--gelo); color: var(--preto); padding: 20px 34px; border-radius:999px; }
.ctas i { width:66px; height:66px; border-radius:50%; background: var(--gelo); display:grid; place-items:center; }
.ctas svg { width:24px; fill:none; stroke: var(--preto); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.mega { position:absolute; left:50%; bottom:-38px; width:1080px; transform:translateX(-50%); z-index:2; fill: var(--gelo); }
.mega .topo { fill: var(--azul); }
