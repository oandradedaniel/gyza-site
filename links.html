main{width:100%;max-width:440px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}

.sep{height:1px;margin:10px 8px 6px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.btn{--mx:50%;--my:50%;position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 18px 12px 14px;border-radius:20px;color:var(--tx);text-decoration:none;font-size:17px;font-weight:500;letter-spacing:-.012em;overflow:hidden;isolation:isolate;

transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,background .3s,box-shadow .35s}
.btn:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:radial-gradient(180px circle at var(--mx) var(--my),rgba(111,147,255,.22),transparent 70%)}

.btn:hover:before{opacity:1}
.btn:active{transform:translateY(0) scale(.985);transition-duration:.12s}
.btn:focus-visible{outline:2px solid var(--azul-l);outline-offset:3px}
.ico{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.2)}

.ico .l{fill:none;stroke:var(--tx);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:var(--tx)}
.txt{flex:1;min-width:0}
.seta{flex:none;width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.2,.8,.2,1),stroke .3s}
.btn:hover .seta{transform:translateX(4px);stroke:var(--tx)}
/* principal */
.btn.principal{min-height:76px;font-size:18px;font-weight:600;color:#050505;border-color:rgba(255,255,255,.9);background:linear-gradient(180deg,#fff,#d9dce3 120%);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(31,79,216,.35),0 18px 60px -12px rgba(31,79,216,.75);-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.principal:before{background:radial-gradient(220px circle at var(--mx) var(--my),rgba(31,79,216,.22),transparent 70%)}
.btn.principal:after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:30%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-18deg);opacity:.7}

.btn.principal:hover .go svg{transform:translateX(3px)}
.btn.principal .txt{padding-left:6px}

.thumbs{order:5;flex:0 0 100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.thumbs img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.92);transition:transform .6s cubic-bezier(.2,.8,.2,1),filter .4s}
.btn.cases:hover .thumbs img{transform:scale(1.06);filter:none}

.av,.logo,.sub,nav>*,footer{animation:sobe .8s cubic-bezier(.2,.8,.2,1) both}
